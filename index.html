<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech App Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        /* تصميم الوضع الداكن الاحترافي الفاخر */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s ease;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInApp 0.6s ease-out;
        }
        @keyframes fadeInApp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 12px;
            font-size: 22px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .top-bar {
            background-color: #051907;
            color: #4caf50;
            padding: 8px 14px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1b4d22;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background-color: #0d1117;
            color: #f0f6fc;
            transition: all 0.25s ease;
        }
        input:focus, select:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
        }
        /* الشاشة الصفراء الكبيرة مع حركة التنبؤ والنبض */
        .weight-display {
            background: linear-gradient(135deg, #fffde7 0%, #fff59d 100%);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            text-align: center;
            padding: 18px 0;
            font-size: 46px;
            font-weight: 800;
            color: #002244;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255,235,59,0.1);
            transition: transform 0.15s ease-in-out;
        }
        .weight-display.pulse {
            transform: scale(1.04);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #0d57d2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(31,111,235,0.2);
            transition: all 0.2s ease;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(31,111,235,0.3);
        }
        .btn-main:active {
            transform: translateY(1px);
        }
        .total-display {
            background-color: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.2);
            color: #ff7b72;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 17px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .manage-section {
            border: 1px dashed #424b55;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            background-color: #161b22;
        }
        .manage-title {
            font-size: 13px;
            color: #58a6ff;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-action {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-delete { background-color: #da3637; }
        .btn-delete:hover { background-color: #b62324; }
        .btn-add { background-color: #238636; }
        .btn-add:hover { background-color: #1a6528; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 18px;
            font-size: 13px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #30363d;
            text-align: center;
        }
        th {
            background-color: #21262d;
            color: #58a6ff;
        }
        tr {
            animation: tableRowSlide 0.35s ease-out forwards;
        }
        @keyframes tableRowSlide {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        td.net-weight {
            color: #ff7b72;
            font-weight: bold;
        }
        .btn-row-delete {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.1s;
        }
        .btn-row-delete:hover {
            transform: scale(1.25);
        }
        .footer-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-excel {
            flex: 2;
            background-color: #238636;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-excel:hover { background-color: #2ea043; transform: translateY(-1px); }
        .btn-reset {
            flex: 1;
            background-color: #484f58;
            color: #f0f6fc;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-reset:hover { background-color: #6e7681; }
        .scale-link {
            text-align: center;
            font-size: 11px;
            color: #8b949e;
            border: 1px solid #30363d;
            padding: 8px;
            border-radius: 6px;
            background-color: #0d1117;
        }
        /* لوحة الـ AI المتوهجة والمتحركة بحركة سينمائية */
        .ai-panel {
            background: linear-gradient(135deg, #2c1a4d 0%, #1a0f30 100%);
            border: 1px solid #8957e5;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12.5px;
            color: #d3b6ff;
            box-shadow: 0 0 10px rgba(137,87,229,0.1);
            animation: aiGlow 3s ease-in-out infinite alternate;
        }
        @keyframes aiGlow {
            from { box-shadow: 0 0 4px rgba(137,87,229,0.15); }
            to { box-shadow: 0 0 12px rgba(137,87,229,0.35); }
        }
        .chart-container {
            margin-bottom: 18px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">🐔 Hawa-Tech App Pro</div>
    
    <div class="top-bar">
        <span id="liveDate">التاريخ: جارٍ التحميل...</span>
        <span id="liveTime">الوقت: جارٍ التحميل...</span>
    </div>

    <div class="inputs-grid">
        <input type="text" id="managerName" placeholder="اسم المسؤول">
        <input type="text" id="workerName" placeholder="اسم العامل">
        <input type="text" id="emailOpt" placeholder="الإيميل (اختياري)">
        <input type="number" id="boxCount" placeholder="عدد الأقفاص" oninput="updateLiveWeight()">
    </div>

    <div class="weight-display" id="weightDisplayBox">0.00</div>
    
    <div style="margin-bottom: 15px;">
        <input type="number" id="grossInput" step="0.01" placeholder="أدخل الوزن القائم هنا" oninput="updateLiveWeight()">
    </div>

    <div class="ai-panel" id="aiPanel">
        🔮 <strong>مساعد الـ AI:</strong> المنظومة جاهزة للتحليل الفوري والتنبؤ التلقائي بالأوزان القادمة.
    </div>

    <div class="manage-section">
        <div class="manage-title">إدارة الأصناف:</div>
        <div style="display: flex; gap: 6px; margin-bottom: 6px;">
            <select id="itemSelect">
                <option value="">-- اختر الصنف --</option>
                <option value="جوانح">جوانح</option>
                <option value="صدر مسحب">صدر مسحب</option>
                <option value="فخاد">فخاد</option>
                <option value="طاووق">طاووق</option>
            </select>
            <button class="btn-action btn-delete" onclick="deleteItem()">حذف 🗑️</button>
        </div>
        <div style="display: flex; gap: 6px;">
            <input type="text" id="newItemInput" placeholder="أضف صنفاً جديداً...">
            <button class="btn-action btn-add" onclick="addItem()">إضافة +</button>
        </div>
    </div>

    <button class="btn-main" onclick="saveCurrentRecord()">تثبيت وحفظ الوزن ✅</button>

    <div class="total-display">
        إجمالي الصافي: <span id="totalNetDisplay">0.00</span> كغ
    </div>

    <div class="chart-container" id="chartDiv" style="display:none;">
        <canvas id="miniChart" style="max-height: 140px;"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>الوقت</th>
                <th>الصنف</th>
                <th>الصافي</th>
                <th>إجراء</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="footer-btns">
        <button class="btn-excel" onclick="exportToExcel()">📊 تحميل ملف Excel</button>
        <button class="btn-reset" onclick="resetDataWithPassword()">❌ تصفير العداد</button>
    </div>

    <div class="scale-link">📍 ربط الميزان الإلكتروني</div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('hawaTechAppData')) || [];
    let myChart = null;
    const tarePerBox = 1.40; // الوزن الثابت والشرعي للقفص

    function updateDateTime() {
        const now = new Date();
        document.getElementById('liveDate').innerText = "التاريخ: " + now.toLocaleDateString('ar-EG');
        document.getElementById('liveTime').innerText = "الوقت: " + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateDateTime, 1000);

    // دالة الحساب المباشر مع إضافة حركة النبض التفاعلية للشاشة الصفراء
    function updateLiveWeight() {
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const totalTare = boxes * tarePerBox;
        const net = gross - totalTare;
        
        const displayBox = document.getElementById('weightDisplayBox');
        displayBox.innerText = gross > 0 ? net.toFixed(2) : "0.00";

        // إحداث نبضة حركية خفيفة عند تعديل الأرقام لجذب الانتباه
        displayBox.classList.add('pulse');
        setTimeout(() => displayBox.classList.remove('pulse'), 150);
    }

    function runAIPrediction() {
        if (records.length < 3) return;
        const netWeights = records.map(r => r.net);
        const xs = tf.tensor1d(Object.keys(netWeights).map(Number));
        const ys = tf.tensor1d(netWeights);
        const model = tf.sequential();
        model.add(tf.layers.dense({units: 1, inputShape: [1]}));
        model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});
        
        model.fit(xs, ys, {epochs: 5}).then(() => {
            const nextIdx = tf.tensor1d([netWeights.length]);
            const pred = model.predict(nextIdx).dataSync()[0];
            document.getElementById('aiPanel').innerHTML = `🔮 <strong>توقع الـ AI للوزنة القادمة:</strong> يُتوقع أن تكون حوالي <span style="font-weight:bold; color:#fbc02d;">${pred.toFixed(2)} كغ</span> بناءً على السجلات.`;
        });
    }

    function saveCurrentRecord() {
        const item = document.getElementById('itemSelect').value;
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const worker = document.getElementById('workerName').value || "عام";
        const totalTare = boxes * tarePerBox;
        const net = gross - totalTare;

        if (!item) { alert("يرجى اختيار الصنف أولاً"); return; }

        const newRecord = {
            time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
            item: item,
            net: net.toFixed(2),
            worker: worker
        };

        records.push(newRecord);
        localStorage.setItem('hawaTechAppData', JSON.stringify(records));
        
        document.getElementById('grossInput').value = "";
        document.getElementById('weightDisplayBox').innerText = "0.00";
        
        updateUI();
    }

    function deleteRecord(index) {
        if(confirm("هل أنت متأكد من حذف هذه الوزنة؟")) {
            records.splice(index, 1);
            localStorage.setItem('hawaTechAppData', JSON.stringify(records));
            updateUI();
        }
    }

    function addItem() {
        const name = document.getElementById('newItemInput').value.trim();
        if(name) {
            const select = document.getElementById('itemSelect');
            const opt = document.createElement('option');
            opt.value = name; opt.innerText = name;
            select.appendChild(opt);
            document.getElementById('newItemInput').value = "";
        }
    }

    function deleteItem() {
        const select = document.getElementById('itemSelect');
        if(select.selectedIndex > 0) { select.remove(select.selectedIndex); }
    }

    function updateUI() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let totalNet = 0;
        let chartData = {};

        records.forEach((r, index) => {
            totalNet += parseFloat(r.net);
            chartData[r.item] = (chartData[r.item] || 0) + parseFloat(r.net);

            // تتدفق الصفوف برمجياً وحركياً عبر الـ CSS المدمج
            const row = `<tr>
                <td>${r.time}</td>
                <td>${r.item}</td>
                <td class="net-weight">${r.net}</td>
                <td><button class="btn-row-delete" onclick="deleteRecord(${index})">❌</button></td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalNetDisplay').innerText = totalNet.toFixed(2);

        if (records.length > 0) {
            document.getElementById('chartDiv').style.display = "block";
            const ctx = document.getElementById('miniChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(chartData),
                    datasets: [{
                        label: 'إجمالي الأوزان لكل صنف',
                        data: Object.values(chartData),
                        backgroundColor: '#58a6ff', // لون يتناسب مع جمالية الـ Dark Mode
                        borderColor: '#1f6feb',
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    scales: { 
                        y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#c9d1d9' } },
                        x: { ticks: { color: '#c9d1d9' } }
                    },
                    plugins: { labels: { color: '#fff' } }
                }
            });
            runAIPrediction();
        } else {
            document.getElementById('chartDiv').style.display = "none";
        }
    }

    function exportToExcel() {
        if(records.length === 0) { alert("لا توجد بيانات لتصديرها"); return; }
        const ws = XLSX.utils.json_to_sheet(records);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "الإنتاج");
        XLSX.writeFile(wb, `HawaTech_Pro_Report_${new Date().toLocaleDateString()}.xlsx`);
    }

    function resetDataWithPassword() {
        const pw = prompt("الرجاء إدخال الرمز السري للتصفير الكامل للعداد:");
        if (pw === '1957') {
            localStorage.removeItem('hawaTechAppData');
            records = [];
            updateUI();
            alert("تم تصفير المنظومة بنجاح");
        } else if(pw !== null) { alert("الرمز السري خاطئ!"); }
    }

    window.onload = function() { updateDateTime(); updateUI(); };
</script>

</body>
</html>
