<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech Pro | نظام إدارة الإنتاج</title>
    <!-- مكتبة توليد الإكسل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #0c356a; --secondary: #279eff; --success: #28a745; --danger: #d32f2f; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .app-card { background: #fff; max-width: 600px; margin: 10px auto; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid var(--primary); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 20px; font-size: 24px; }
        .input-box { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box; }
        input:focus { border-color: var(--secondary); }
        .row { display: flex; gap: 10px; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        .btn-save { background: var(--primary); color: #fff; }
        .btn-save:active { transform: scale(0.98); }
        .btn-excel { background: var(--success); color: #fff; margin-top: 20px; font-size: 16px; }
        .table-container { margin-top: 25px; overflow-x: auto; border-radius: 10px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: #fff; min-width: 400px; }
        th { background: #f1f1f1; padding: 12px; font-size: 14px; color: var(--primary); }
        td { padding: 12px; border-top: 1px solid #eee; text-align: center; font-size: 14px; }
        .net-total { color: var(--danger); font-weight: bold; background: #fff0f0; border-radius: 5px; padding: 2px 5px; }
        .footer-tools { text-align: center; margin-top: 20px; }
        .btn-clear { background: none; color: #999; font-size: 13px; text-decoration: underline; border: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-card">
    <h2>Hawa-Tech 🐔 <br><span style="font-size: 14px; color: var(--secondary);">نظام الإنتاج الذكي</span></h2>
    
    <div class="input-box">
        <label>المشرف المسؤول</label>
        <input type="text" id="supervisor" placeholder="أدخل اسمك">
    </div>

    <div class="input-box">
        <label>نوع الصنف</label>
        <select id="item">
            <option value="فروج مسحب كامل">فروج مسحب كامل</option>
            <option value="صدر مسحب">صدر مسحب</option>
            <option value="فخاد مسحب">فخاد مسحب</option>
            <option value="ورك مسحب">ورك مسحب</option>
            <option value="جوانح">جوانح</option>
            <option value="طاووق">طاووق</option>
        </select>
    </div>

    <div class="row">
        <div class="input-box" style="flex: 2;">
            <label>الوزن القائم (كغ)</label>
            <input type="number" id="gross" placeholder="0.00" step="0.01">
        </div>
        <div class="input-box" style="flex: 1;">
            <label>الأقفاص</label>
            <input type="number" id="cages" value="1">
        </div>
    </div>

    <button class="btn btn-save" onclick="addEntry()">تثبيت الوزن الآن ✅</button>

    <div class="table-container">
        <table id="logTable">
            <thead>
                <tr>
                    <th>الوقت</th>
                    <th>الصنف</th>
                    <th>الصافي</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <button class="btn btn-excel" onclick="exportData()">📊 تحميل تقرير الوردية (Excel)</button>

    <div class="footer-tools">
        <button class="btn-clear" onclick="resetApp()">تصفير السجل لبدء يوم جديد</button>
    </div>
</div>

<script>
    // تهيئة البيانات من الذاكرة المحلية
    let logs = JSON.parse(localStorage.getItem('hawa_pro_logs')) || [];

    function addEntry() {
        const sup = document.getElementById('supervisor').value;
        const itm = document.getElementById('item').value;
        const grs = parseFloat(document.getElementById('gross').value);
        const cgs = parseInt(document.getElementById('cages').value) || 0;

        if (!sup || !grs) {
            alert("عذراً! يرجى إدخال اسم المشرف والوزن.");
            return;
        }

        // الحساب: القائم - (عدد الأقفاص * 1.5 كغ وزن القفص الفارغ)
        const net = (grs - (cgs * 1.5)).toFixed(2);
        const time = new Date().toLocaleTimeString('ar-LB', {hour: '2-digit', minute:'2-digit'});

        const entry = { "الوقت": time, "المشرف": sup, "الصنف": itm, "الوزن القائم": grs, "الأقفاص": cgs, "الوزن الصافي": net };
        
        logs.push(entry);
        localStorage.setItem('hawa_pro_logs', JSON.stringify(logs));
        
        render();
        document.getElementById('gross').value = ""; // تصفير الوزن لسرعة الإدخال التالي
    }

    function render() {
        const tbody = document.querySelector('#logTable tbody');
        tbody.innerHTML = logs.map((r, index) => `
            <tr>
                <td>${r["الوقت"]}</td>
                <td>${r["الصنف"]}</td>
                <td><span class="net-total">${r["الوزن الصافي"]}</span></td>
            </tr>
        `).reverse().join('');
    }

    function exportData() {
        if (logs.length === 0) return alert("لا توجد بيانات!");
        const ws = XLSX.utils.json_to_sheet(logs);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "إنتاج اليوم");
        XLSX.writeFile(wb, `Hawa_Report_${new Date().toLocaleDateString()}.xlsx`);
    }

    function resetApp() {
        if (confirm("هل تريد مسح السجل الحالي والبدء من الصفر؟")) {
            logs = [];
            localStorage.removeItem('hawa_pro_logs');
            render();
        }
    }

    render(); // عرض البيانات المخزنة فور فتح البرنامج
</script>

</body>
</html>
