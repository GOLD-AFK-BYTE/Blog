<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech Secure System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #003366; --accent: #d32f2f; --bg: #f4f7f6; --success: #28a745; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); padding: 10px; margin: 0; }
        .container { max-width: 900px; background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); margin: auto; border-top: 10px solid var(--primary); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 20px; font-size: 24px; }
        .status-bar { display: flex; justify-content: space-between; background: #333; color: #fff; padding: 12px 20px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        #totalWeight { background: #fffbe6; border: 2px solid #ffd666; font-size: 35px; color: var(--accent); font-weight: bold; text-align: center; height: 70px; }
        .btn-main { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 22px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-serial { background: #6c757d; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; width: 100%; margin-bottom: 15px; font-size: 14px; }
        .table-container { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 500px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: var(--primary); color: white; }
        .actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-excel { flex: 2; padding: 12px; background: var(--success); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-clear { flex: 1; padding: 12px; background: #666; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Hawa-Tech Enterprise System</h2>
    
    <div class="status-bar">
        <span>الوقت: <span id="clock">--:--:--</span></span>
        <span>الميزان: <span id="scaleStatus">مفصول</span></span>
    </div>

    <button type="button" class="btn-serial" onclick="connectScale()">🔌 ربط الميزان الإلكتروني</button>

    <form id="production-form">
        <div class="grid-inputs">
            <input type="text" id="supervisor" name="supervisor" placeholder="اسم المسؤول" required>
            <input type="text" id="worker" name="worker" placeholder="اسم العامل">
        </div>

        <div class="grid-inputs">
            <input type="number" id="totalWeight" name="gross" step="0.01" placeholder="0.00" required>
            <div style="text-align: center;">
                <label style="font-size: 12px; font-weight: bold;">عدد الأقفاص</label>
                <input type="number" id="cages" name="cages" value="1">
            </div>
        </div>

        <div style="margin-bottom: 15px;">
            <select id="itemSelect" name="item"></select>
            <div style="display: flex; gap: 5px; margin-top: 10px;">
                <input type="text" id="newItemName" placeholder="أضف صنفاً جديداً..." style="font-size: 14px;">
                <button type="button" onclick="addNewItem()" style="background: var(--primary); color: white; border: none; padding: 0 15px; border-radius: 5px; cursor: pointer;">إضافة</button>
            </div>
        </div>

        <button type="submit" class="btn-main">تثبيت الوزن وحفظ البيانات ✅</button>
    </form>

    <div class="table-container">
        <table id="prodTable">
            <thead>
                <tr>
                    <th>الوقت</th>
                    <th>المسؤول</th>
                    <th>الصنف</th>
                    <th>الوزن الخام</th>
                    <th>الصافي</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="actions">
        <button class="btn-excel" onclick="downloadExcel()">📊 تحميل ملف Excel</button>
        <button class="btn-clear" onclick="clearData()">❌ تصفير السجل</button>
    </div>
</div>

<script>
    // --- إعدادات الربط مع Google Sheets ---
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwCyQmKxI31jypHIOxsXfVjc6aSS5aPyXvE2kRsjcR8nk7J-UcI-k3hUCoCSSk09rt0jA/exec';
    const form = document.getElementById('production-form');

    // --- إدارة البيانات المحلية ---
    let dataLog = JSON.parse(localStorage.getItem('hawa_log')) || [];
    let customItems = JSON.parse(localStorage.getItem('hawa_items')) || ["فروج مسحب كامل", "فخاد مسحب", "ورك مسحب", "صدر مسحب", "لحمة طاووق"];
    
    // تحديث الساعة
    setInterval(() => { 
        document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-LB'); 
    }, 1000);

    // تهيئة قائمة الأصناف
    function initItems() {
        const select = document.getElementById('itemSelect');
        select.innerHTML = customItems.map(i => `<option value="${i}">${i}</option>`).join('');
    }

    function addNewItem() {
        const name = document.getElementById('newItemName').value;
        if (name) {
            customItems.unshift(name);
            localStorage.setItem('hawa_items', JSON.stringify(customItems));
            initItems();
            document.getElementById('newItemName').value = "";
        }
    }

    // ربط الميزان
    async function connectScale() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            document.getElementById('scaleStatus').innerText = "متصل ✅";
            const textDecoder = new TextDecoderStream();
            port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                let val = value.replace(/[^\d.]/g, '');
                if (val) document.getElementById('totalWeight').value = val;
            }
        } catch (e) { alert("يرجى اختيار المنفذ أو تأكد من دعم المتصفح"); }
    }

    // عرض الجدول
    function renderTable() {
        const tbody = document.querySelector("#prodTable tbody");
        tbody.innerHTML = dataLog.map(r => `
            <tr>
                <td>${r.time}</td>
                <td>${r.supervisor}</td>
                <td>${r.item}</td>
                <td>${r.total}</td>
                <td style="color:red; font-weight:bold;">${r.net}</td>
            </tr>
        `).reverse().join('');
    }

    // وظيفة الإرسال والحفظ
    form.addEventListener('submit', e => {
        e.preventDefault();
        
        const weight = parseFloat(document.getElementById('totalWeight').value);
        const cages = parseInt(document.getElementById('cages').value) || 0;
        const netWeight = (weight - (cages * 1.5)).toFixed(2);

        const entry = {
            time: new Date().toLocaleString('ar-LB'),
            supervisor: document.getElementById('supervisor').value,
            worker: document.getElementById('worker').value || "-",
            item: document.getElementById('itemSelect').value,
            total: weight,
            net: netWeight
        };

        // 1. الحفظ المحلي
        dataLog.push(entry);
        localStorage.setItem('hawa_log', JSON.stringify(dataLog));
        renderTable();

        // 2. الإرسال إلى Google Sheets
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                alert("تم الحفظ محلياً وإرسال البيانات لجوجل بنجاح! ✅");
                document.getElementById('totalWeight').value = "";
            })
            .catch(error => {
                alert("تم الحفظ محلياً، لكن فشل الإرسال لجوجل. تأكد من الإنترنت.");
            });
    });

    function downloadExcel() {
        const ws = XLSX.utils.json_to_sheet(dataLog);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "الإنتاج");
        XLSX.writeFile(wb, `Report_Hawa_${new Date().toLocaleDateString()}.xlsx`);
    }
    
    function clearData() {
        if (prompt("أدخل كلمة المرور لتصفير السجل:") === "2021") {
            dataLog = [];
            localStorage.removeItem('hawa_log');
            renderTable();
        } else {
            alert("كلمة المرور خاطئة!");
        }
    }

    // بدء التشغيل
    initItems();
    renderTable();
</script>

</body>
</html>
