<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech Pro | Final Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #003366; --bg: #f4f7f6; --card: #ffffff; --text: #333;
            --display-bg: #fffbe6; --display-border: #ffe58f; --info-bar: #222;
        }
        [data-theme="dark"] {
            --bg: #121212; --card: #1e1e1e; --text: #e0e0e0;
            --display-bg: #2a2600; --display-border: #ffd700; --info-bar: #000;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 10px; transition: 0.3s; }
        .container { max-width: 600px; margin: auto; background: var(--card); border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid rgba(0,0,0,0.1); }
        .header { background: var(--card); padding: 15px; text-align: center; border-bottom: 3px solid var(--primary); position: relative; }
        .theme-toggle { position: absolute; left: 15px; top: 15px; background: var(--primary); color: white; border: none; padding: 8px 12px; border-radius: 50%; cursor: pointer; font-size: 18px; }
        .info-bar { background: var(--info-bar); color: #fff; padding: 10px; font-size: 12px; display: flex; justify-content: space-between; font-family: monospace; }
        .form-content { padding: 20px; }
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
        input, select { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; background: var(--card); color: var(--text); text-align: center; font-size: 15px; }
        .weight-display { background: var(--display-bg); border: 2px solid var(--display-border); padding: 20px; font-size: 50px; font-weight: bold; color: var(--primary); text-align: center; border-radius: 10px; margin-bottom: 15px; }
        [data-theme="dark"] .weight-display { color: #ffd700; }
        .btn-main { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .item-management { background: rgba(0,0,0,0.03); padding: 10px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 15px; }
        .btn-action { padding: 10px; border: none; border-radius: 6px; cursor: pointer; color: white; font-weight: bold; }
        .btn-add { background: #28a745; }
        .btn-del { background: #dc3545; }
        .total-box { margin-top: 15px; padding: 15px; background: rgba(0,51,102,0.1); border: 1px solid var(--primary); border-radius: 8px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background: var(--primary); color: white; }
    </style>
</head>
<body data-theme="light">

<div class="container">
    <div class="header">
        <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
        <h1>Hawa-Tech Enterprise System 🐔</h1>
    </div>
    
    <div class="info-bar">
        <span id="liveTime">--:--</span>
        <span id="liveDate">--/--/--</span>
    </div>

    <div class="form-content">
        <div class="input-row">
            <input type="text" id="supervisor" placeholder="اسم المسؤول" required>
            <input type="text" id="worker" placeholder="اسم العامل" required>
        </div>
        <div class="input-row">
            <input type="email" id="email" placeholder="البريد (اختياري)">
            <input type="number" id="cages" placeholder="الأقفاص" value="1" required>
        </div>

        <div class="weight-display" id="displayWeight">0.00</div>
        <input type="number" id="gross" step="0.01" placeholder="أدخل الوزن القائم هنا" style="width: 100%; margin-bottom: 15px; display: block;" required>

        <!-- إدارة الأصناف في مكان واحد -->
        <div class="item-management">
            <label style="display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px;">إدارة الأصناف:</label>
            <div class="input-row">
                <select id="item" required style="flex: 3;">
                    <option value="">-- اختر الصنف --</option>
                    <option value="فروج مسحب كامل">فروج مسحب كامل</option>
                    <option value="صدر مسحب">صدر مسحب</option>
                    <option value="فخاد مسحب">فخاد مسحب</option>
                    <option value="جوانح">جوانح</option>
                </select>
                <button type="button" class="btn-action btn-del" onclick="removeSelectedItem()">حذف 🗑️</button>
            </div>
            <div class="input-row">
                <input type="text" id="newItem" placeholder="اكتب صنفاً جديداً هنا..." style="flex: 3;">
                <button type="button" class="btn-action btn-add" onclick="addNewItem()">إضافة +</button>
            </div>
        </div>

        <button type="button" onclick="saveEntry()" class="btn-main">تثبيت وحفظ البيانات ✅</button>

        <div class="total-box">
            <strong>إجمالي الصافي اليومي: </strong>
            <span id="totalNetWeight" style="font-size: 20px; color: #d32f2f; font-weight: bold;">0.00</span> كغ
        </div>

        <table id="dataTable">
            <thead><tr><th>الوقت</th><th>الصنف</th><th>الصافي</th></tr></thead>
            <tbody></tbody>
        </table>

        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button onclick="exportToExcel()" style="flex: 2; padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer;">📊 Excel</button>
            <button onclick="secureClear()" style="flex: 1; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; cursor: pointer;">❌ تصفير</button>
        </div>
        <button onclick="connectSerial()" style="width: 100%; margin-top: 10px; font-size: 11px; background: none; border: 1px solid #ccc; cursor: pointer; color: #888;">🔌 ربط الميزان</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('hawa_final_db')) || [];

    function toggleTheme() {
        const body = document.body;
        body.setAttribute('data-theme', body.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
    }

    setInterval(() => {
        const now = new Date();
        document.getElementById('liveTime').innerText = "الوقت: " + now.toLocaleTimeString('ar-LB');
        document.getElementById('liveDate').innerText = "التاريخ: " + now.toLocaleDateString('ar-LB');
    }, 1000);

    document.getElementById('gross').addEventListener('input', e => {
        document.getElementById('displayWeight').innerText = e.target.value || "0.00";
    });

    function addNewItem() {
        const val = document.getElementById('newItem').value.trim();
        if (val) {
            const sel = document.getElementById('item');
            const opt = document.createElement('option');
            opt.value = val; opt.text = val;
            sel.add(opt); sel.value = val;
            document.getElementById('newItem').value = "";
        } else { alert("اكتب اسم الصنف أولاً"); }
    }

    function removeSelectedItem() {
        const sel = document.getElementById('item');
        if (sel.selectedIndex > 0) {
            if(confirm("حذف الصنف المختار؟")) sel.remove(sel.selectedIndex);
        } else { alert("اختر صنفاً من القائمة لحذفه"); }
    }

    function saveEntry() {
        const gross = document.getElementById('gross').value;
        const item = document.getElementById('item').value;
        const supervisor = document.getElementById('supervisor').value;
        const worker = document.getElementById('worker').value;

        if (!gross || !item || !supervisor || !worker) {
            alert("يرجى ملء جميع الخانات (المسؤول، العامل، الوزن، والصنف)");
            return;
        }

        const cages = parseInt(document.getElementById('cages').value);
        const net = (parseFloat(gross) - (cages * 1.5)).toFixed(2);
        
        db.push({
            time: new Date().toLocaleTimeString('ar-LB'),
            item: item,
            net: net
        });

        localStorage.setItem('hawa_final_db', JSON.stringify(db));
        render();
        document.getElementById('gross').value = "";
        document.getElementById('displayWeight').innerText = "0.00";
    }

    function render() {
        const tbody = document.querySelector('#dataTable tbody');
        let total = 0;
        tbody.innerHTML = db.slice(-5).map(r => {
            total += parseFloat(r.net);
            return `<tr><td>${r.time}</td><td>${r.item}</td><td style="color:red; font-weight:bold;">${r.net}</td></tr>`;
        }).reverse().join('');
        document.getElementById('totalNetWeight').innerText = total.toFixed(2);
    }

    function secureClear() {
        if (prompt("كلمة السر (1957):") === "1957") {
            db = []; localStorage.removeItem('hawa_final_db'); render();
        }
    }

    function exportToExcel() {
        const ws = XLSX.utils.json_to_sheet(db);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Production");
        XLSX.writeFile(wb, "Hawa_Report.xlsx");
    }

    async function connectSerial() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            const reader = port.readable.getReader();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const weight = new TextDecoder().decode(value).replace(/[^0-9.]/g, '');
                if (weight) { document.getElementById('gross').value = weight; document.getElementById('displayWeight').innerText = weight; }
            }
        } catch (e) { alert("الميزان غير متصل."); }
    }

    render();
</script>
</body>
</html>
