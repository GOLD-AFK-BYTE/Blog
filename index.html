<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech App Pro (Standard Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-body: #f4f4f4;
            --bg-container: white;
            --border-color: #ddd;
            --text-color: #333;
            --input-bg: #fafafa;
            --header-color: #003366;
            --panel-bg: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            --panel-text: #4a148c;
            --panel-border: #8e44ad;
            --chart-grid: #ddd;
            --chart-bar: #004d80;
            --section-bg: #f9f9f9;
        }

        .dark-version {
            --bg-body: #0d1117;
            --bg-container: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --input-bg: #0d1117;
            --header-color: #58a6ff;
            --panel-bg: linear-gradient(135deg, #2c1a4d 0%, #1a0f30 100%);
            --panel-text: #d3b6ff;
            --panel-border: #8957e5;
            --chart-grid: #30363d;
            --chart-bar: #58a6ff;
            --section-bg: #21262d;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            padding: 20px;
            box-sizing: border-box;
            animation: fadeInApp 0.6s ease-out;
            position: relative;
        }
        @keyframes fadeInApp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .theme-toggle-btn:hover {
            transform: scale(1.05);
        }

        .header {
            text-align: center;
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 12px;
            font-size: 22px;
            letter-spacing: 0.5px;
            transition: color 0.3s ease;
        }
        .top-bar {
            background-color: #051907;
            color: #4caf50;
            padding: 8px 14px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1b4d22;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text-color);
            transition: all 0.25s ease;
        }
        input:focus, select:focus {
            border-color: #58a6ff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(88,166,255,0.15);
        }
        
        .weight-display {
            background: linear-gradient(135deg, #fffde7 0%, #fff59d 100%);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            text-align: center;
            padding: 18px 0;
            font-size: 46px;
            font-weight: 800;
            color: #002244;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(255,235,59,0.1);
            transition: transform 0.15s ease-in-out;
        }
        .weight-display.pulse {
            transform: scale(1.04);
        }

        .optional-section {
            background-color: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .section-subtitle {
            font-size: 13px;
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #0d57d2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(31,111,235,0.2);
            transition: all 0.2s ease;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(31,111,235,0.3);
        }
        .total-display {
            background-color: rgba(248,81,73,0.1);
            border: 1px solid rgba(248,81,73,0.2);
            color: #ff7b72;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 17px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .manage-section {
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            background-color: var(--bg-container);
        }
        .manage-title {
            font-size: 13px;
            color: var(--header-color);
            font-weight: bold;
            margin-bottom: 10px;
        }
        .btn-action {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-delete { background-color: #da3637; }
        .btn-add { background-color: #238636; }
        
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 500px;
        }
        th, td {
            padding: 8px 6px;
            border: 1px solid var(--border-color);
            text-align: center;
        }
        th {
            background-color: var(--input-bg);
            color: var(--header-color);
        }
        tr {
            animation: tableRowSlide 0.35s ease-out forwards;
        }
        @keyframes tableRowSlide {
            from { opacity: 0; transform: translateX(10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        td.net-weight {
            color: #4caf50;
            font-weight: bold;
        }
        .btn-row-delete {
            background: none;
            border: none;
            color: #f85149;
            cursor: pointer;
            font-size: 15px;
            transition: transform 0.1s;
        }
        .btn-row-delete:hover {
            transform: scale(1.25);
        }
        .footer-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-excel {
            flex: 2;
            background-color: #238636;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-reset {
            flex: 1;
            background-color: #484f58;
            color: #f0f6fc;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .scale-link {
            text-align: center;
            font-size: 11px;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 6px;
            background-color: var(--input-bg);
        }
        
        .ai-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            font-size: 12.5px;
            color: var(--panel-text);
            animation: ai
