<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech Enterprise System Pro | Light Mode</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { 
            --primary: #003366; 
            --bg-light: #f4f7f6; 
            --card-bg: #ffffff; 
            --text-dark: #333333; 
            --yellow-display: #fffbe6; 
            --border-yellow: #ffe58f;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-light); color: var(--text-dark);
            margin: 0; padding: 10px;
        }
        .container { 
            max-width: 600px; margin: auto; background: var(--card-bg); 
            border-radius: 12px; box-shadow: 0 5px 25px rgba(0,0,0,0.1); overflow: hidden; 
            border: 1px solid #ddd;
        }
        .header { background: #ffffff; padding: 15px; text-align: center; border-bottom: 3px solid var(--primary); }
        .header h1 { color: var(--primary); font-size: 20px; margin: 0; }
        
        /* شريط الوقت والتاريخ (نفس تصميم الصورة الأصلية) */
        .info-bar { background: #222; color: #ffffff; padding: 10px; font-size: 13px; display: flex; justify-content: space-between; }
        
        .form-content { padding: 20px; }
        .input-row { display: flex; gap: 10px; margin-bottom: 12px; }
        
        input, select { 
            flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; 
            text-align: center; font-size: 15px; background: #fff; color: #000; outline: none;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 5px rgba(0,51,102,0.2); }
        
        /* شاشة الوزن الصفراء الكبيرة */
        .weight-display { 
            background: var(--yellow-display); border: 2px solid var(--border-yellow); 
            padding: 25px; font-size: 55px; font-weight: bold; color: var(--primary); 
            text-align: center; border-radius: 10px; margin-bottom: 15px;
        }
        
        .btn-connect { width: 100%; background: #f0f0f0; color: #555; padding: 8px; margin-bottom: 15px; border: 1px dashed #bbb; cursor: pointer; border-radius: 6px; font-size: 13px; }
        .btn-main { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main:active { transform: scale(0.98); }

        .total-box { margin-top: 15px; padding: 15px; background: #e6f7ff; border: 1px solid #91d5ff; border-radius: 8px; text-align: center; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #fafafa; }
        .net-val { color: #d32f2f; font-weight: bold; }

        .footer-btns { display: flex; gap: 10px; margin-top: 15px; }
        .btn-excel { flex: 2; background: #28a745; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-clear { flex: 1; background: #6c757d; color: white; padding: 12px; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Hawa-Tech Enterprise System 🐔</h1>
    </div>
    
    <div class="info-bar">
        <span id="liveTime">الوقت: --:--</span>
        <span id="liveDate">التاريخ: --/--/--</span>
    </div>

    <div class="form-content">
        <button class="btn-connect" onclick="connectSerial()">🔌 ربط الميزان الإلكتروني (USB)</button>
        
        <form id="hawaForm">
            <div class="input-row">
                <input type="text" id="supervisor" placeholder="اسم المسؤول" required>
                <input type="text" id="worker" placeholder="اسم العامل" required>
            </div>

            <div class="input-row">
                <input type="email" id="email" placeholder="البريد (اختياري)">
                <input type="number" id="cages" placeholder="عدد الأقفاص" value="1" required>
            </div>

            <div class="weight-display" id="displayWeight">0.00</div>
            <input type="number" id="gross" step="0.01" placeholder="أدخل الوزن القائم هنا" style="width: 100%; margin-bottom: 15px;" required>

            <select id="item" required style="width: 100%; margin-bottom: 15px;">
                <option value="">-- اختر الصنف --</option>
                <option value="فروج مسحب كامل">فروج مسحب كامل</option>
                <option value="صدر مسحب">صدر مسحب</option>
                <option value="فخاد مسحب">فخاد مسحب</option>
                <option value="جوانح">جوانح</option>
                <option value="طاووق">طاووق</option>
                <option value="سودة">سودة</option>
                <option value="قوانص">قوانص</option>
            </select>

            <button type="submit" class="btn-main">تثبيت وحفظ البيانات ✅</button>
        </form>

        <div class="total-box">
            <strong style="color: var(--primary);">إجمالي الإنتاج الصافي (كغ): </strong>
            <span id="totalNetWeight" style="font-size: 22px; color: #d32f2f; font-weight: bold;">0.00</span>
        </div>

        <table id="dataTable">
            <thead>
                <tr>
                    <th>الوقت</th>
                    <th>الصنف</th>
                    <th>القائم</th>
                    <th>الصافي</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div class="footer-btns">
            <button class="btn-excel" onclick="exportToExcel()">📊 تحميل Excel</button>
            <button class="btn-clear" onclick="secureClear()">❌ تصفير السجل</button>
        </div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('hawa_enterprise_db')) || [];

    // تحديث الوقت والتاريخ
    function updateClock() {
        const now = new Date();
        document.getElementById('liveTime').innerText = "الوقت: " + now.toLocaleTimeString('ar-LB');
        document.getElementById('liveDate').innerText = "التاريخ: " + now.toLocaleDateString('ar-LB');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ربط الوزن بالشاشة الصفراء
    document.getElementById('gross').addEventListener('input', e => {
        document.getElementById('displayWeight').innerText = e.target.value || "0.00";
    });

    // ربط الميزان الإلكتروني
    async function connectSerial() {
        try {
            const port = await navigator.serial.requestPort();
            await port.open({ baudRate: 9600 });
            const reader = port.readable.getReader();
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                const weight = new TextDecoder().decode(value).replace(/[^0-9.]/g, '');
                if (weight) {
                    document.getElementById('gross').value = weight;
                    document.getElementById('displayWeight').innerText = weight;
                }
            }
        } catch (e) {
            alert("الميزان غير متصل أو المتصفح لا يدعم الخاصية. تأكد من استخدام Chrome.");
        }
    }

    // حفظ البيانات
    document.getElementById('hawaForm').onsubmit = e => {
        e.preventDefault();
        const gross = parseFloat(document.getElementById('gross').value);
        const cages = parseInt(document.getElementById('cages').value);
        const net = (gross - (cages * 1.5)).toFixed(2);
        
        db.push({
            time: new Date().toLocaleTimeString('ar-LB'),
            supervisor: document.getElementById('supervisor').value,
            item: document.getElementById('item').value,
            gross: gross,
            net: net
        });

        localStorage.setItem('hawa_enterprise_db', JSON.stringify(db));
        render();
        document.getElementById('gross').value = "";
        document.getElementById('displayWeight').innerText = "0.00";
    };

    function render() {
        const tbody = document.querySelector('#dataTable tbody');
        let total = 0;
        tbody.innerHTML = db.slice(-5).map(r => {
            total += parseFloat(r.net);
            return `<tr><td>${r.time}</td><td>${r.item}</td><td>${r.gross}</td><td class="net-val">${r.net}</td></tr>`;
        }).reverse().join('');
        document.getElementById('totalNetWeight').innerText = total.toFixed(2);
    }

    // تصفير السجل بكلمة السر 1957
    function secureClear() {
        const pass = prompt("أدخل كلمة السر للتصفير:");
        if (pass === "1957") {
            if (confirm("هل تريد مسح جميع البيانات؟")) {
                db = [];
                localStorage.removeItem('hawa_enterprise_db');
                render();
            }
        } else {
            alert("كلمة السر خاطئة!");
        }
    }

    function exportToExcel() {
        if(db.length === 0) return alert("السجل فارغ!");
        const ws = XLSX.utils.json_to_sheet(db);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "إنتاج هوا");
        XLSX.writeFile(wb, `Report_${new Date().toLocaleDateString()}.xlsx`);
    }

    render();
</script>
</body>
</html>
