<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech App Pro (Strict Manual Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        :root {
            --bg-body: #f4f4f4;
            --bg-container: white;
            --border-color: #ddd;
            --text-color: #333;
            --input-bg: #fafafa;
            --header-color: #003366;
            --panel-bg: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 100%);
            --panel-text: #006064;
            --panel-border: #00acc1;
            --chart-grid: #ddd;
            --chart-bar: #004d80;
            --section-bg: #f9f9f9;
        }

        .dark-version {
            --bg-body: #0d1117;
            --bg-container: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --input-bg: #0d1117;
            --header-color: #58a6ff;
            --panel-bg: linear-gradient(135deg, #002d32 0%, #004d40 100%);
            --panel-text: #b2dfdb;
            --panel-border: #00897b;
            --chart-grid: #30363d;
            --chart-bar: #58a6ff;
            --section-bg: #21262d;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .app-container {
            width: 100%;
            max-width: 550px;
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.15);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        
        .theme-toggle-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .header {
            text-align: center;
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 12px;
            font-size: 22px;
        }
        .top-bar {
            background-color: #051907;
            color: #4caf50;
            padding: 8px 14px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1b4d22;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 12px;
        }
        .inputs-grid-three {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 5px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        
        .weight-display {
            background: linear-gradient(135deg, #fffde7 0%, #fff59d 100%);
            border: 2px solid #fbc02d;
            border-radius: 12px;
            text-align: center;
            padding: 18px 0;
            font-size: 46px;
            font-weight: 800;
            color: #002244;
            margin-bottom: 15px;
        }

        .optional-section {
            background-color: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .section-subtitle {
            font-size: 13px;
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 8px;
        }

        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #0d57d2 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .btn-transfer-hourly {
            width: 100%;
            background: linear-gradient(135deg, #e65100 0%, #bf360c 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 5px;
        }

        .total-display {
            background-color: rgba(35,134,54,0.1);
            border: 1px solid rgba(35,134,54,0.2);
            color: #238636;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        
        .table-responsive { width: 100%; overflow-x: auto; margin-bottom: 18px; border-radius: 8px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 650px; }
        th, td { padding: 10px 6px; border: 1px solid var(--border-color); text-align: center; white-space: nowrap; }
        th { background-color: var(--input-bg); color: var(--header-color); }
        .row-order-transfer { background-color: rgba(230,81,0,0.06); }
        
        .excel-buttons-zone { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .btn-excel-custom { width: 100%; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .bg-staff { background-color: #0288d1; }
        .bg-orders { background-color: #e65100; }

        /* لوحة التفكيك اليدوية بالكامل */
        .deconstruct-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--panel-text);
        }
        .deconstruct-title { font-weight: bold; margin-bottom: 8px; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 4px; }
        .deconstruct-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
        .deconstruct-row input { padding: 8px; font-size: 13px; border-radius: 6px; text-align: center; }
        .btn-add-sub { background-color: #00897b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; width: 100%; margin-top: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()">🌙 داكن</button>
    <div class="header">🐔 Hawa-Tech App Pro</div>
    
    <div class="top-bar">
        <span id="liveDate">التاريخ: جارٍ التحميل...</span>
        <span id="liveTime">الوقت: جارٍ التحميل...</span>
    </div>

    <!-- معلومات المسؤول والعمال الأساسية -->
    <div class="inputs-grid">
        <input type="text" id="managerName" placeholder="اسم المسؤول">
        <input type="text" id="workerName" placeholder="اسم العامل">
        <input type="text" id="emailOpt" placeholder="الإيميل (اختياري)">
        <input type="number" id="boxCount" placeholder="عدد الأقفاص" oninput="updateLiveWeight()">
    </div>

    <div style="margin-bottom: 12px;">
        <input type="number" id="palletWeightOpt" step="0.01" placeholder="وزن الطبلية (اختياري - كغ)" oninput="updateLiveWeight()">
    </div>

    <div class="weight-display" id="weightDisplayBox">0.00</div>
    
    <div style="margin-bottom: 15px;">
        <input type="number" id="grossInput" step="0.01" placeholder="أدخل الوزن القائم الحالي (كغ)" oninput="updateLiveWeight()">
    </div>

    <!-- لوحة التفكيك والاشتقاق اليدوية (أنت من يكتب الاسم والوزن بنفسك) -->
    <div class="deconstruct-panel">
        <div class="deconstruct-title">📋 نظام تفكيك واشتقاق الأصناف يدوياً (أدخل أوزانك بنفسك):</div>
        <div id="subItemsContainer">
            <!-- أسطر فارغة يقوم المستخدم بملئها يدوياً -->
        </div>
        <button class="btn-add-sub" onclick="addNewSubItemRow()">+ إضافة صنف مستخرج ووزنه يدوياً</button>
    </div>

    <button class="btn-main" onclick="saveCurrentRecord()">تثبيت وحفظ الوزن فقط ✅</button>

    <div class="manage-section" style="margin-bottom:15px;">
        <select id="itemSelect" onchange="updateUI()">
            <option value="">-- اختر الصنف الأساسي --</option>
            <option value="جوانح">جوانح</option>
            <option value="صدر مسحب">صدر مسحب</option>
            <option value="فخاد">فخاد</option>
            <option value="فروج كامل">فروج كامل</option>
        </select>
    </div>

    <!-- قسم بيانات البراد الكامل والخانة التي حُذفت سابقاً عادت بالكامل -->
    <div class="optional-section" style="border: 1px solid #e65100; background-color: rgba(230,81,0,0.03);">
        <div class="section-subtitle" style="color: #e65100;">📦 معلومات ترحيل البراد الرسمية:</div>
        <div class="inputs-grid-three" style="margin-bottom: 8px;">
            <input type="number" id="chickenCountOpt" placeholder="عدد الفروج">
            <input type="text" id="orderNumberOpt" placeholder="رقم الطلبية">
            <input type="text" id="destinationOpt" placeholder="المرسل إليه / الموقع">
        </div>
        <div class="inputs-grid" style="margin-bottom: 8px;">
            <input type="text" id="fridgeTempOpt" placeholder="درجة حرارة البراد (مثال: 4°C)">
            <input type="text" id="fridgeLocationOpt" placeholder="موقع البراد / رقم المستودع">
        </div>
        <div style="margin-bottom: 8px;">
            <input type="text" id="fridgeKeeperOpt" placeholder="اسم مسؤول المستودع المستلم">
        </div>
        <button class="btn-transfer-hourly" onclick="transferOrderToFridge()">ترحيل الطلبية الحالية إلى البراد 📦</button>
    </div>

    <div class="total-display" style="margin-top:15px;">
        إجمالي الصافي للصنف المختار حالياً: <span id="totalNetDisplay">0.00</span> كغ
    </div>

    <div class="chart-container" style="display:none;">
        <canvas id="miniChart"></canvas>
    </div>

    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>الوقت</th>
                    <th>نوع العملية</th>
                    <th>الصنف الأساسي</th>
                    <th>الوزن القائم</th>
                    <th>الوزن الصافي</th>
                    <th>رقم الطلبية</th>
                    <th>الموقع / الحرارة</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="excel-buttons-zone">
        <button class="btn-excel-custom bg-staff" onclick="exportStaffExcel()">📊 1. تحميل ملف إكسل الخاص بالموظفين والأوزان</button>
        <button class="btn-excel-custom bg-orders" onclick="exportOrdersExcel()">📊 2. تحميل ملف إكسل التقارير المترحلة للبراد</button>
    </div>

</div>

<script>
    let records = JSON.parse(localStorage.getItem('hawaTechAppData')) || [];
    const tarePerBox = 1.40;

    function toggleTheme() {
        document.body.classList.toggle('dark-version');
        localStorage.setItem('hawaTechTheme', document.body.classList.contains('dark-version') ? 'dark' : 'light');
    }

    function updateDateTime() {
        const now = new Date();
        document.getElementById('liveDate').innerText = "التاريخ: " + now.toLocaleDateString('ar-EG');
        document.getElementById('liveTime').innerText = "الوقت: " + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateDateTime, 1000);

    function createSubItemRow() {
        const container = document.getElementById('subItemsContainer');
        const div = document.createElement('div');
        div.className = "deconstruct-row";
        div.innerHTML = `
            <input type="text" class="sub-name" placeholder="اسم المستخرج يدوياً" style="flex: 2;">
            <input type="number" class="sub-weight" step="0.01" placeholder="الوزن الصافي كغ" style="flex: 2;">
            <button type="button" style="background:#da3637; color:white; border:none; border-radius:6px; cursor:pointer; padding:8px;" onclick="this.parentElement.remove();">❌</button>
        `;
        container.appendChild(div);
    }

    function addNewSubItemRow() {
        createSubItemRow();
    }

    function updateLiveWeight() {
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const palletWeight = parseFloat(document.getElementById('palletWeightOpt').value) || 0;
        const net = gross - ((boxes * tarePerBox) + palletWeight);
        document.getElementById('weightDisplayBox').innerText = gross > 0 ? (net > 0 ? net.toFixed(2) : "0.00") : "0.00";
    }

    function saveCurrentRecord() {
        const item = document.getElementById('itemSelect').value;
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const palletWeight = parseFloat(document.getElementById('palletWeightOpt').value) || 0;
        const net = gross - ((boxes * tarePerBox) + palletWeight);

        if (!item) { alert("يرجى اختيار الصنف الأساسي أولاً"); return; }
        if (gross === 0) { alert("يرجى إدخال وزن قائم صحيح"); return; }

        records.push({
            recordType: "وزنة_فردية",
            manager: document.getElementById('managerName').value || "غير محدد",
            worker: document.getElementById('workerName').value || "عام",
            email: document.getElementById('emailOpt').value || "لا يوجد",
            boxes: boxes,
            palletWeight: palletWeight.toFixed(2),
            gross: gross.toFixed(2), 
            net: net.toFixed(2),     
            item: item, // يظهر باسم الصنف الأساسي
            time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
            date: new Date().toLocaleDateString('ar-EG')
        });

        localStorage.setItem('hawaTechAppData', JSON.stringify(records));
        clearInputs();
        updateUI();
        alert(`تم حفظ وزنة (${item}) بنجاح ✅`);
    }

    function transferOrderToFridge() {
        const parentItem = document.getElementById('itemSelect').value;
        if (!parentItem) { alert("يرجى اختيار الصنف الأساسي للترحيل"); return; }

        const subRows = document.querySelectorAll('.deconstruct-row');
        
        // جلب الخانات الرسمية للبراد التي طلبت عدم حذفها
        const orderNumber = document.getElementById('orderNumberOpt').value || "-";
        const destination = document.getElementById('destinationOpt').value || "-";
        const temp = document.getElementById('fridgeTempOpt').value || "-";
        const location = document.getElementById('fridgeLocationOpt').value || "-";
        const keeper = document.getElementById('fridgeKeeperOpt').value || "-";
        const chickenCount = document.getElementById('chickenCountOpt').value || "-";

        if (subRows.length > 0) {
            // إذا قام بإدخال أصناف مفككة يدوياً، نقوم بترحيلها كلها تحت اسم "الصنف الأساسي" بالأسفل وببيانات البراد كاملة
            subRows.forEach(r => {
                const manualName = r.querySelector('.sub-name').value || "مستخرج يدوي";
                const manualWeight = parseFloat(r.querySelector('.sub-weight').value) || 0;

                records.push({
                    recordType: "ترحيل_براد",
                    manager: document.getElementById('managerName').value || "غير محدد",
                    item: parentItem, // إجبار الاسم أن يظهر باسم الصنف الأساسي بالأسفل بحسب طلبك
                    manualSubName: manualName, // حفظ الاسم المستخرج داخلياً للإكسل فقط إذا أردت
                    gross: manualWeight.toFixed(2),
                    net: manualWeight.toFixed(2),
                    orderNumber: orderNumber,
                    destination: destination,
                    fridgeTemp: temp,
                    fridgeLocation: location,
                    fridgeKeeper: keeper,
                    chickenCount: chickenCount,
                    time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
                    date: new Date().toLocaleDateString('ar-EG')
                });
            });
        } else {
            // ترحيل عادي في حال لم يستخدم لوحة التفكيك
            const liveNet = parseFloat(document.getElementById('weightDisplayBox').innerText) || 0;
            const liveGross = parseFloat(document.getElementById('grossInput').value) || 0;

            records.push({
                recordType: "ترحيل_براد",
                manager: document.getElementById('managerName').value || "غير محدد",
                item: parentItem,
                manualSubName: "-",
                gross: liveGross.toFixed(2),
                net: liveNet.toFixed(2),
                orderNumber: orderNumber,
                destination: destination,
                fridgeTemp: temp,
                fridgeLocation: location,
                fridgeKeeper: keeper,
                chickenCount: chickenCount,
                time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
                date: new Date().toLocaleDateString('ar-EG')
            });
        }

        localStorage.setItem('hawaTechAppData', JSON.stringify(records));
        clearInputs();
        updateUI();
        alert("تم ترحيل البيانات كاملة إلى البراد بنجاح وثبات وباسم الصنف الأساسي! 📦");
    }

    function clearInputs() {
        document.getElementById('grossInput').value = "";
        document.getElementById('boxCount').value = "";
        document.getElementById('palletWeightOpt').value = "";
        document.getElementById('chickenCountOpt').value = "";
        document.getElementById('orderNumberOpt').value = "";
        document.getElementById('destinationOpt').value = "";
        document.getElementById('fridgeTempOpt').value = "";
        document.getElementById('fridgeLocationOpt').value = "";
        document.getElementById('fridgeKeeperOpt').value = "";
        document.getElementById('weightDisplayBox').innerText = "0.00";
        document.getElementById('subItemsContainer').innerHTML = "";
    }

    function deleteRecord(index) {
        if(confirm("هل أنت متأكد من حذف هذا السجل؟")) {
            records.splice(index, 1);
            localStorage.setItem('hawaTechAppData', JSON.stringify(records));
            updateUI();
        }
    }

    function updateUI() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        const selectedItem = document.getElementById('itemSelect').value;
        let totalNet = 0;

        records.forEach((r, index) => {
            if (r.item === selectedItem) {
                totalNet += parseFloat(r.net) || 0;
            }

            const isTransfer = r.recordType === "ترحيل_براد";
            const locInfo = isTransfer ? `${r.fridgeLocation} / ${r.fridgeTemp}` : "-";

            tbody.innerHTML += `
                <tr class="${isTransfer ? 'row-order-transfer' : ''}">
                    <td>${r.time}</td>
                    <td style="font-weight:bold; color: ${isTransfer ? '#e65100':'#1f6feb'}">${isTransfer ? '📦 للبراد' : '⚖️ وزنة خط'}</td>
                    <td><strong>${r.item}</strong></td> 
                    <td>${r.gross} كغ</td>
                    <td style="font-weight:bold;">${r.net} كغ</td>
                    <td>${r.orderNumber || "-"}</td>
                    <td>${locInfo}</td>
                    <td><button style="background:none; border:none; color:red; cursor:pointer;" onclick="deleteRecord(${index})">❌</button></td>
                </tr>
            `;
        });

        document.getElementById('totalNetDisplay').innerText = totalNet.toFixed(2);
    }

    function exportStaffExcel() {
        const filtered = records.filter(r => r.recordType === "وزنة_فردية");
        const data = filtered.map(r => ({ "المسؤول": r.manager, "العامل": r.worker, "الصنف الأساسي": r.item, "الوزن القائم": parseFloat(r.gross), "الصافي": parseFloat(r.net), "التاريخ": r.date, "الوقت": r.time }));
        const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "الأوزان"); XLSX.writeFile(wb, "Staff_Weights.xlsx");
    }

    // هنا تظهر البيانات كاملة في ملف إكسل البراد مع الخانات التي طلبتها
    function exportOrdersExcel() {
        const filtered = records.filter(r => r.recordType === "ترحيل_براد");
        const data = filtered.map(r => ({ 
            "رقم الطلبية": r.orderNumber, 
            "الصنف الأساسي": r.item, 
            "اسم المشتق (المنزل يدوي)": r.manualSubName,
            "الوزن الصافي المبرد": parseFloat(r.net), 
            "عدد الفروج": r.chickenCount,
            "المرسل إليه / الوجهة": r.destination, 
            "موقع البراد": r.fridgeLocation,
            "درجة الحرارة": r.fridgeTemp,
            "مسؤول المستودع المستلم": r.fridgeKeeper,
            "التاريخ": r.date,
            "الوقت": r.time
        }));
        const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "البراد الكامل"); XLSX.writeFile(wb, "Fridge_Transfers.xlsx");
    }

    window.onload = function() { updateDateTime(); updateUI(); };
</script>
</body>
</html>
