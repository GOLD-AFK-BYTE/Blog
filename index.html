<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech Deconstruction Tracker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-body: #f4f7f6;
            --bg-container: white;
            --border-color: #ddd;
            --text-color: #333;
            --header-color: #003366;
            --main-blue: #1f6feb;
            --accent-orange: #e65100;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-container);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 15px;
            font-size: 24px;
        }

        /* قسم الطبلية الرئيسية بالبراد */
        .pallet-section {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            border: 2px solid #00897b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            color: #004d40;
        }

        .pallet-title {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background-color: #fafafa;
        }

        .master-weight-display {
            background-color: #004d40;
            color: #fff59d;
            text-align: center;
            padding: 12px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            margin-top: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        /* قسم تفكيك الأصناف والعمال تحت الطبلية */
        .deconstruct-section {
            background-color: #f9f9f9;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            color: var(--header-color);
            margin-bottom: 12px;
            font-size: 15px;
        }

        .deconstruct-row {
            display: grid;
            grid-template-columns: 1.5fr 1.5fr 1fr auto;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .btn-add-row {
            background-color: #00897b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 5px;
        }

        /* لوحة الحسبة الحية والذكية */
        .live-calc-panel {
            background-color: #fffde7;
            border: 1px solid #fbc02d;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .calc-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 1px dashed #eceff1;
        }
        .calc-item:last-child { border-bottom: none; margin-bottom: 0; }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #1f6feb 0%, #0d57d2 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(31,111,235,0.2);
        }

        .btn-submit:hover { opacity: 0.9; }

        .table-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            min-width: 500px;
        }

        th, td {
            padding: 10px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        th { background-color: #f1f1f1; color: var(--header-color); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">📋 منظومة تفكيك الطبلية الموحدة</div>

    <!-- 1️⃣ خانة الطبلية الكبيرة فوق الأصناف المفككة -->
    <div class="pallet-section">
        <div class="pallet-title">❄️ بيانات طبلية البراد الرئيسية:</div>
        <div class="inputs-grid">
            <input type="number" id="grossInput" placeholder="الوزن القائم الكلي (كغ)" oninput="calcPalletNet()">
            <input type="number" id="boxCount" placeholder="عدد الأقفاص" oninput="calcPalletNet()">
        </div>
        <div style="margin-bottom: 10px;">
            <input type="number" id="palletWeight" placeholder="وزن لوح الطبلية الخشبي (كغ)" oninput="calcPalletNet()">
        </div>
        <div class="master-weight-display">
            الوزن الصافي للطبلية: <span id="palletNetDisplay">0.00</span> كغ
        </div>
    </div>

    <!-- 2️⃣ الأصناف المفككة والعمال تحت الطبلية -->
    <div class="deconstruct-section">
        <div class="section-title">🔪 الأصناف المستخرجة والعمال المسؤولين:</div>
        <div id="rowsContainer">
            <!-- سيتم توليد الأسطر هنا ديناميكياً -->
        </div>
        <button class="btn-add-row" onclick="addDeconstructRow()">+ إضافة صنف مستخرج / عامل جديد</button>
    </div>

    <!-- 3️⃣ لوحة المراقبة والحسبة الحية -->
    <div class="live-calc-panel">
        <div class="calc-item">
            <span>🟢 مجموع اللحم الصافي الفعلي المستخرج:</span>
            <span id="sumNetDisplay" style="font-weight:bold; color:#238636;">0.00 كغ</span>
        </div>
        <div class="calc-item">
            <span>🔴 وزن العظم / الهدر والفاقد الحالي:</span>
            <span id="wasteDisplay" style="font-weight:bold; color:#da3637;">0.00 كغ</span>
        </div>
    </div>

    <button class="btn-submit" onclick="savePalletSession()">✅ حفظ وإغلاق ملف الطبلية بالكامل</button>

    <!-- جدول تاريخ العمليات السابقة -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>التاريخ/الوقت</th>
                    <th>صافي الطبلية الأصلية</th>
                    <th>مجموع المستخرج</th>
                    <th>الهدر الناتِج</th>
                    <th>عدد الأصناف</th>
                </tr>
            </thead>
            <tbody id="historyBody">
                <!-- البيانات المخزنة سابقاً -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const tarePerBox = 1.40;
    let sessions = JSON.parse(localStorage.getItem('hawaTechSessions')) || [];

    // إضافة سطر جديد تلقائياً عند فتح البرنامج
    window.onload = function() {
        addDeconstructRow();
        renderHistory();
    };

    function calcPalletNet() {
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const palletW = parseFloat(document.getElementById('palletWeight').value) || 0;

        const totalTare = (boxes * tarePerBox) + palletW;
        let net = gross - totalTare;
        if(net < 0) net = 0;

        document.getElementById('palletNetDisplay').innerText = net.toFixed(2);
        calculateLiveResult();
    }

    function addDeconstructRow() {
        const container = document.getElementById('rowsContainer');
        const div = document.createElement('div');
        div.className = "deconstruct-row";
        div.innerHTML = `
            <select class="item-select">
                <option value="صدر مسحب">صدر مسحب</option>
                <option value="فخاد">فخاد</option>
                <option value="جوانح">جوانح</option>
                <option value="طاووق">طاووق</option>
                <option value="سودة">سودة</option>
            </select>
            <input type="text" class="worker-input" placeholder="اسم العامل">
            <input type="number" class="weight-input" step="0.01" placeholder="الوزن (كغ)" oninput="calculateLiveResult()">
            <button style="background:#da3637; color:white; border:none; border-radius:6px; padding:6px 10px; cursor:pointer;" onclick="this.parentElement.remove(); calculateLiveResult();">❌</button>
        `;
        container.appendChild(div);
    }

    function calculateLiveResult() {
        const palletNet = parseFloat(document.getElementById('palletNetDisplay').innerText) || 0;
        
        // جمع كل أوزان الأصناف التي أدخلها العمال
        const weightInputs = document.querySelectorAll('.weight-input');
        let sumExtracted = 0;
        weightInputs.forEach(input => {
            sumExtracted += parseFloat(input.value) || 0;
        });

        // حساب الهدر
        let waste = palletNet - sumExtracted;
        if(waste < 0 || palletNet === 0) waste = 0;

        document.getElementById('sumNetDisplay').innerText = sumExtracted.toFixed(2) + " كغ";
        document.getElementById('wasteDisplay').innerText = waste.toFixed(2) + " كغ";
    }

    function savePalletSession() {
        const palletNet = parseFloat(document.getElementById('palletNetDisplay').innerText) || 0;
        if(palletNet === 0) {
            alert("يرجى إدخال وزن الطبلية البراد الرئيسية أولاً!");
            return;
        }

        const rows = document.querySelectorAll('.deconstruct-row');
        let itemsList = [];
        let sumExtracted = 0;

        rows.forEach(row => {
            const item = row.querySelector('.item-select').value;
            const worker = row.querySelector('.worker-input').value || "عام";
            const weight = parseFloat(row.querySelector('.weight-input').value) || 0;
            
            if(weight > 0) {
                sumExtracted += weight;
                itemsList.push({ item, worker, weight: weight.toFixed(2) });
            }
        });

        let waste = palletNet - sumExtracted;
        if(waste < 0) waste = 0;

        const sessionRecord = {
            date: new Date().toLocaleDateString('ar-EG'),
            time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),
            palletNet: palletNet.toFixed(2),
            sumExtracted: sumExtracted.toFixed(2),
            waste: waste.toFixed(2),
            details: itemsList
        };

        sessions.push(sessionRecord);
        localStorage.setItem('hawaTechSessions', JSON.stringify(sessions));

        // تصفير الخانات للعملية التالية
        document.getElementById('grossInput').value = "";
        document.getElementById('boxCount').value = "";
        document.getElementById('palletWeight').value = "";
        document.getElementById('palletNetDisplay').innerText = "0.00";
        document.getElementById('rowsContainer').innerHTML = "";
        
        addDeconstructRow();
        calculateLiveResult();
        renderHistory();

        alert("تم حفظ ملف الطبلية بالكامل وربط الأصناف بالعمال بنجاح! 💾");
    }

    function renderHistory() {
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = "";
        sessions.forEach(s => {
            tbody.innerHTML += `<tr>
                <td>${s.date} ${s.time}</td>
                <td style="font-weight:bold; color:#004d40;">${s.palletNet} كغ</td>
                <td style="color:#238636; font-weight:bold;">${s.sumExtracted} كغ</td>
                <td style="color:#da3637;">${s.waste} كغ</td>
                <td>${s.details.length} أصناف</td>
            </tr>`;
        });
    }
</script>
</body>
</html>
