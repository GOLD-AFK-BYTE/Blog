<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hawa-Tech App</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            padding: 15px;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            font-weight: bold;
            color: #003366;
            margin-bottom: 10px;
            font-size: 18px;
        }
        .top-bar {
            background-color: #051907;
            color: #4caf50;
            padding: 6px 12px;
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background-color: #fafafa;
        }
        .weight-display {
            background-color: #fffde7;
            border: 1px solid #ffe082;
            border-radius: 8px;
            text-align: center;
            padding: 15px 0;
            font-size: 42px;
            font-weight: bold;
            color: #003366;
            margin-bottom: 12px;
        }
        .btn-main {
            width: 100%;
            background-color: #003366;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 12px;
        }
        .total-display {
            background-color: #ffeeed;
            border: 1px solid #ffcdd2;
            color: #d32f2f;
            text-align: center;
            padding: 10px;
            font-weight: bold;
            font-size: 16px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .manage-section {
            border: 1px dashed #b0bec5;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            background-color: #fbfbfb;
        }
        .manage-title {
            font-size: 12px;
            color: #003366;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .btn-action {
            padding: 10px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-delete { background-color: #e53935; }
        .btn-add { background-color: #2e7d32; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 15px;
            font-size: 12px;
        }
        th, td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background-color: #004d80;
            color: white;
        }
        td.net-weight {
            color: #e53935;
            font-weight: bold;
        }
        .footer-btns {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .btn-excel {
            flex: 2;
            background-color: #1b5e20;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-reset {
            flex: 1;
            background-color: #78909c;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .scale-link {
            text-align: center;
            font-size: 11px;
            color: #757575;
            border: 1px solid #e0e0e0;
            padding: 6px;
            border-radius: 4px;
        }

        .ai-panel {
            background-color: #f3e5f5;
            border: 1px dashed #8e44ad;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #4a148c;
        }
        .chart-container {
            margin-bottom: 15px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">🐔 Hawa-Tech App</div>
    
    <div class="top-bar">
        <span id="liveDate">التاريخ: جارٍ التحميل...</span>
        <span id="liveTime">الوقت: جارٍ التحميل...</span>
    </div>

    <div class="inputs-grid">
        <input type="text" id="managerName" placeholder="اسم المسؤول">
        <input type="text" id="workerName" placeholder="اسم العامل">
        <input type="text" id="emailOpt" placeholder="الإيميل (اختياري)">
        <input type="number" id="boxCount" placeholder="عدد الأقفاص" oninput="updateLiveWeight()">
    </div>

    <div class="weight-display" id="weightDisplayBox">0.00</div>
    
    <div style="margin-bottom: 12px;">
        <input type="number" id="grossInput" step="0.01" placeholder="أدخل الوزن القائم هنا" oninput="updateLiveWeight()">
    </div>

    <div class="ai-panel" id="aiPanel">
        🔮 <strong>مساعد الـ AI:</strong> المنظومة جاهزة وبانتظار الحفظ للتحليل والتنبؤ التلقائي بالإنتاج القادم.
    </div>

    <div class="manage-section">
        <div class="manage-title">إدارة الأصناف:</div>
        <div style="display: flex; gap: 5px; margin-bottom: 5px;">
            <select id="itemSelect">
                <option value="">-- اختر الصنف --</option>
                <option value="جوانح">جوانح</option>
                <option value="صدر مسحب">صدر مسحب</option>
                <option value="فخاد">فخاد</option>
                <option value="طاووق">طاووق</option>
            </select>
            <button class="btn-action btn-delete" onclick="deleteItem()">حذف 🗑️</button>
        </div>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="newItemInput" placeholder="أضف صنفاً جديداً...">
            <button class="btn-action btn-add" onclick="addItem()">إضافة +</button>
        </div>
    </div>

    <button class="btn-main" onclick="saveCurrentRecord()">تثبيت وحفظ الوزن ✅</button>

    <div class="total-display">
        إجمالي الصافي: <span id="totalNetDisplay">0.00</span> كغ
    </div>

    <div class="chart-container" id="chartDiv" style="display:none;">
        <canvas id="miniChart" style="max-height: 130px;"></canvas>
    </div>

    <table>
        <thead>
            <tr>
                <th>الوقت</th>
                <th>الصنف</th>
                <th>الصافي</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>

    <div class="footer-btns">
        <button class="btn-excel" onclick="exportToExcel()">📊 تحميل ملف Excel</button>
        <button class="btn-reset" onclick="resetDataWithPassword()">❌ تصفير</button>
    </div>

    <div class="scale-link">📍 ربط الميزان الإلكتروني</div>
</div>

<script>
    let records = JSON.parse(localStorage.getItem('hawaTechAppData')) || [];
    let myChart = null;
    
    // تعديل رسمي: اعتماد وزن القفص بدقة على 1.40 كغ بناءً على طلبك
    const tarePerBox = 1.40; 

    function updateDateTime() {
        const now = new Date();
        document.getElementById('liveDate').innerText = "التاريخ: " + now.toLocaleDateString('ar-EG');
        document.getElementById('liveTime').innerText = "الوقت: " + now.toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'});
    }
    setInterval(updateDateTime, 1000);

    // الحساب المباشر بالوزن الجديد للقفص 1.40 كغ
    function updateLiveWeight() {
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const totalTare = boxes * tarePerBox;
        const net = gross - totalTare;
        
        document.getElementById('weightDisplayBox').innerText = gross > 0 ? net.toFixed(2) : "0.00";
    }

    // تشغيل محرك التنبؤ الذكي بشكل خلفي مرن
    function runAIPrediction() {
        if (records.length < 3) return;
        const netWeights = records.map(r => r.net);
        const xs = tf.tensor1d(Object.keys(netWeights).map(Number));
        const ys = tf.tensor1d(netWeights);
        const model = tf.sequential();
        model.add(tf.layers.dense({units: 1, inputShape: [1]}));
        model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});
        
        model.fit(xs, ys, {epochs: 5}).then(() => {
            const nextIdx = tf.tensor1d([netWeights.length]);
            const pred = model.predict(nextIdx).dataSync()[0];
            document.getElementById('aiPanel').innerHTML = `🔮 <strong>توقع الـ AI للوزنة القادمة:</strong> يُتوقع أن تكون حوالي <span style="font-weight:bold;">${pred.toFixed(2)} كغ</span> بناءً على الأرقام الحالية المحفوظة.`;
        });
    }

    // حفظ السجلات فوري وبحرية كاملة
    function saveCurrentRecord() {
        const item = document.getElementById('itemSelect').value;
        const gross = parseFloat(document.getElementById('grossInput').value) || 0;
        const boxes = parseFloat(document.getElementById('boxCount').value) || 0;
        const worker = document.getElementById('workerName').value || "عام";
        const totalTare = boxes * tarePerBox;
        const net = gross - totalTare;

        if (!item) { alert("يرجى اختيار الصنف أولاً"); return; }

        const newRecord = {
            time: new Date().toLocaleTimeString('ar-EG', {hour: '2-digit', minute:'2-digit'}),
            item: item,
            net: net.toFixed(2),
            worker: worker
        };

        records.push(newRecord);
        localStorage.setItem('hawaTechAppData', JSON.stringify(records));
        
        document.getElementById('grossInput').value = "";
        document.getElementById('weightDisplayBox').innerText = "0.00";
        
        updateUI();
    }

    function addItem() {
        const name = document.getElementById('newItemInput').value.trim();
        if(name) {
            const select = document.getElementById('itemSelect');
            const opt = document.createElement('option');
            opt.value = name; opt.innerText = name;
            select.appendChild(opt);
            document.getElementById('newItemInput').value = "";
        }
    }

    function deleteItem() {
        const select = document.getElementById('itemSelect');
        if(select.selectedIndex > 0) {
            select.remove(select.selectedIndex);
        }
    }

    function updateUI() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        let totalNet = 0;
        let chartData = {};

        records.forEach(r => {
            totalNet += parseFloat(r.net);
            chartData[r.item] = (chartData[r.item] || 0) + parseFloat(r.net);

            const row = `<tr>
                <td>${r.time}</td>
                <td>${r.item}</td>
                <td class="net-weight">${r.net}</td>
            </tr>`;
            tbody.innerHTML += row;
        });

        document.getElementById('totalNetDisplay').innerText = totalNet.toFixed(2);

        if (records.length > 0) {
            document.getElementById('chartDiv').style.display = "block";
            const ctx = document.getElementById('miniChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(chartData),
                    datasets: [{
                        label: 'إجمالي الأوزان لكل صنف',
                        data: Object.values(chartData),
                        backgroundColor: '#004d80'
                    }]
                },
                options: { responsive: true, scales: { y: { beginAtZero: true } } }
            });
            runAIPrediction();
        } else {
            document.getElementById('chartDiv').style.display = "none";
        }
    }

    function exportToExcel() {
        if(records.length === 0) { alert("لا توجد بيانات لتصديرها"); return; }
        const ws = XLSX.utils.json_to_sheet(records);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "الإنتاج");
        XLSX.writeFile(wb, `HawaTech_Report_${new Date().toLocaleDateString()}.xlsx`);
    }

    function resetDataWithPassword() {
        const pw = prompt("الرجاء إدخال الرمز السري للتصفير:");
        if (pw === '1957') {
            localStorage.removeItem('hawaTechAppData');
            records = [];
            updateUI();
            alert("تم التصفير بنجاح");
        } else if(pw !== null) {
            alert("الرمز السري خاطئ!");
        }
    }

    window.onload = function() { updateDateTime(); updateUI(); };
</script>

</body>
</html>
